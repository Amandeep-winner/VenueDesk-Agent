[tool.pytest.ini_options]
pythonpath = [".", "venuedesk-backend", "venuedesk-agent"]
testpaths = ["venuedesk-backend/tests", "venuedesk-agent/tests", "tests/e2e", "tests"]
python_files = ["test_*.py"]
markers = [
    "unit: Fast isolated unit tests",
    "integration: Integration tests with database and endpoints",
    "e2e: End-to-end full lifecycle workflow tests",
    "postgres: Tests requiring live PostgreSQL service container",
    "slow: Tests taking more than two seconds",
]

[tool.coverage.run]
branch = true
source = ["venuedesk-backend/app", "venuedesk-agent/agent"]
omit = [
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
