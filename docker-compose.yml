services:
  postgres:
    image: postgres:16-alpine
    container_name: venuedesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: venuedesk
      POSTGRES_USER: venuedesk
      POSTGRES_PASSWORD: venuedesk_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venuedesk -d venuedesk"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./venuedesk-backend
      dockerfile: Dockerfile
    container_name: venuedesk-backend
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-key-change-in-prod-1234567890}
      DATABASE_URL: postgresql://venuedesk:venuedesk_dev_password@postgres:5432/venuedesk
      DEPLOYMENT_SALT: ${DEPLOYMENT_SALT:-venuedesk-prod-salt-must-be-at-least-32-chars!}
      ALLOW_UNCLAIMED_ENROLLMENT: "false"
      PORT: 5001
      PROXYFIX_ENABLED: "true"
      HSTS_ENABLED: "true"
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: venuedesk-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    profiles:
      - proxy

volumes:
  postgres_data:
